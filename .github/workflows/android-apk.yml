name: Android APK

# Compila o runtime (libmain.so) + SDL3 + deps e gera a APK "limpa" (sem nenhum arquivo do jogo).
# O codigo recompilado do jogo e construido no proprio aparelho a partir dos arquivos do jogador
# (ferramenta onDeviceBuild), entao este workflow nao precisa nem de game files.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: SDK packages (NDK 27.2, platform 36, build-tools)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1"

      - name: Cache das deps (SDL3, FFmpeg, shaderc, Vulkan headers, VMA, volk, Turnip)
        uses: actions/cache@v4
        with:
          path: |
            build/android/deps
            build/android/src
            build/android/work
            build/android/SDL3
          key: android-deps-${{ hashFiles('tools/android/build_deps.sh') }}
          restore-keys: android-deps-

      - name: Deps
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: bash tools/android/build_deps.sh

      - name: APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload da APK
        uses: actions/upload-artifact@v4
        with:
          name: itprecomp-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
